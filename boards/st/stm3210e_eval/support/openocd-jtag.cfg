# STM3210E-EVAL OpenOCD — JTAG on CN9 (ARM 20-pin)
#
# Default SWD config: support/openocd-swd.cfg
# Use this file for full JTAG:
#   west flash -r openocd --config boards/st/stm3210e_eval/support/openocd-jtag.cfg
#   west debug -r openocd --config boards/st/stm3210e_eval/support/openocd-jtag.cfg
#
# Requires STLINK-V3MINI (+ adapter) ribbon on CN9 (TDI/TDO/TMS/TCK/nTRST/NRST).

source [find interface/stlink.cfg]
transport select hla_jtag

set FLASH_SIZE 0x100000

source [find target/stm32f1x.cfg]

reset_config srst_only srst_nogate connect_assert_srst
adapter speed 1000

$_TARGETNAME configure -event gdb-attach {
	echo "Debugger attaching: reset halt"
	reset halt
	gdb_breakpoint_override hard
}

$_TARGETNAME configure -event gdb-detach {
	echo "Debugger detaching (target left halted; use 'c' then quit to resume)"
}
