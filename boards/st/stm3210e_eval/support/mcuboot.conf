#
# Replaces MCUboot prj.conf when passed as CONF_FILE (not EXTRA_CONF_FILE).
# Partitions come from the board DTS fixed-partitions node.
#
# ECDSA-P256 + TinyCrypt keeps the bootloader within the 64 KiB boot
# partition on STM32F103ZG (RSA/mbedTLS is too large for this slot).
#
# Signing key path: pass -DZPLATFORM_ROOT=<zplatform abs path> at build time
# (scripts do this). CMake expands \${ZPLATFORM_ROOT} below.

CONFIG_FLASH=y
CONFIG_MAIN_STACK_SIZE=10240
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

CONFIG_BOOT_UPGRADE_ONLY=y
# Equal 448 KiB bank-aligned slots: overwrite-only avoids swap-move's
# need for a spare primary sector (which we cannot spare in bank1).
#CONFIG_BOOT_SWAP_USING_MOVE=y
CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
CONFIG_BOOT_SIGNATURE_KEY_FILE="\${ZPLATFORM_ROOT}/keys/root-ec-p256.pem"
CONFIG_BOOT_BOOTSTRAP=y

# Zephyr + MCUboot banners on USART1 (*** Booting MCUboot ... ***)
CONFIG_BOOT_BANNER=y
CONFIG_MCUBOOT_BOOT_BANNER=y
CONFIG_BOOT_DELAY=100

CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_DEFAULT_LEVEL=0
CONFIG_MCUBOOT_LOG_LEVEL_INF=y
CONFIG_CBPRINTF_NANO=y
CONFIG_PICOLIBC=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=0
