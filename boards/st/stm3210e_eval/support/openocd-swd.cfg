# STM3210E-EVAL OpenOCD — SWD on CN9
#
# Default OpenOCD transport for this board (see docs/boards/stm3210e_eval.md).
# JTAG variant: support/openocd-jtag.cfg
#
# Notes (STLINK-V3MINI + HLA):
# - Plain "halt" often times out while the app is running; use reset halt on attach.
# - Do not auto-resume on detach (resume after HLA attach can drop SWD).
# - If Tamper put the MCU in STANDBY, press Wakeup (or re-flash) before debug.

source [find interface/stlink.cfg]
transport select hla_swd

# XL-density F103ZG is 1 MiB; default stm32f1x probe can report 512 KiB.
set FLASH_SIZE 0x100000

source [find target/stm32f1x.cfg]

reset_config srst_only srst_nogate connect_assert_srst

$_TARGETNAME configure -event gdb-attach {
	echo "Debugger attaching: reset halt"
	reset halt
	gdb_breakpoint_override hard
}

$_TARGETNAME configure -event gdb-detach {
	echo "Debugger detaching (target left halted; use 'c' then quit to resume)"
}
