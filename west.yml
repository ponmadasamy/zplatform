manifest:
  version: "1.2"

  # Manifest repo path comes from the workspace .west/config (absolute path to
  # this clone). Do not require a workspace/zplatform junction.

  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      # KEEP IN SYNC with config/toolchain.yml (zephyr.revision).
      # Validated by scripts/env/zplatform_env.py — do not edit alone.
      revision: v4.4.2
      import:
        name-allowlist:
          - cmsis_6
          - hal_stm32
          - mcuboot
          - mbedtls
          - tf-psa-crypto
          - segger
          - net-tools
          - zcbor
          - lvgl
