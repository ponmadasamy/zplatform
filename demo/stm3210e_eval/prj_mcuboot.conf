#
# Extra Kconfig when building under MCUboot (slot0 layout).
# Applied via EXTRA_CONF_FILE from build.ps1 / build.sh.
#
# west build signs zephyr.bin -> zephyr.signed.bin via imgtool when
# CONFIG_MCUBOOT_SIGNATURE_KEY_FILE is set. Scripts pass
# -DZPLATFORM_ROOT so CMake expands ${ZPLATFORM_ROOT} below.
#
# --pad is required so the image trailer sits at the end of the slot.
# For BOOT_SWAP_USING_MOVE with equal 448 KiB slots, pad to the full
# partition (0x70000); the move sector is managed inside that slot.
# Do NOT pad to a smaller size — MCUboot looks for magic at slot end.

CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y

CONFIG_MCUBOOT_SIGNATURE_KEY_FILE="\${ZPLATFORM_ROOT}/keys/root-ec-p256.pem"
CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION="1.0.0"
CONFIG_MCUBOOT_EXTRA_IMGTOOL_ARGS="--pad"
